name: Daily Dofus Asset Update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - run: pip install requests
      
      - name: Run Harvester
        run: python harvest.py
      
      - name: Commit Assets
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git pull origin main
          git add assets/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update assets" && git push)
