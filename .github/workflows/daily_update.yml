name: Daily Dofus Asset Update
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests
      - run: python harvest.py
      
      - name: Commit Assets
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # FORCE ADD the assets folder
          git add assets/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update assets" && git push)
