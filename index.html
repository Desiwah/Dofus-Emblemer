<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Dofus Emblemer</title>
    <link rel="icon" type="image/png"
        href="https://static.ankama.com/dofus/renderer/emblem/1/1/0xEAEAEA/0x464646/64_64-0.png">
    <style>
        body {
            background-color: #1a1a1a;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin: 0 0 5px 0;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .container {
            display: flex;
            flex: 1;
            gap: 20px;
            overflow: hidden;
        }

        .column {
            background: #2c2c2c;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .col-left,
        .col-right {
            flex: 1;
            border: 1px solid #444;
            position: relative;
            min-height: 0;
        }

        .col-center {
            flex: 0 0 350px;
            align-items: center;
            padding-top: 10px;
            border: 1px solid #444;
        }

        .status-bar {
            background: #222;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #444;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, 60px);
            gap: 15px;
            justify-content: center;
            justify-items: start;
            padding: 0px 10px;
            align-content: flex-start;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .item-box {
            width: 60px;
            height: 60px;
            background: #333;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            display: none;
            /* hidden until loaded */
            align-items: center;
            justify-content: center;
        }

        .item-box.visible {
            display: flex;
            animation: popIn 0.2s ease-out;
        }

        .item-box:hover {
            border-color: #7f8c8d;
            background: #444;
        }

        .item-box.selected {
            border-color: #ffffff;
            background: #555;
            border-width: 2px;
        }

        .item-box img {
            max-width: 45px;
            max-height: 45px;
        }

        .id-tag {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 9px;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            padding: 1px 3px;
            border-radius: 3px;
            pointer-events: none;
        }

        .preview-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 25px;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            border: 1px solid #555;
            border-radius: 10px;
            background-image: linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px;
        }

        .swap-container {
            display: flex;
            justify-content: center;
            margin: -15px 0 5px 0;
            z-index: 5;
            position: relative;
        }

        .swap-btn {
            background: #222;
            border: 1px solid #555;
            color: #888;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin: 10px;
        }

        .swap-btn:hover {
            background: #444;
            color: #fff;
            border-color: #fff;
            transform: rotate(180deg);
        }

        .control-group {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
            color: #ddd;
        }

        .color-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        input[type="text"].hex-input {
            width: 70px;
            padding: 8px 8px 8px 20px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #111;
            color: #fff;
            font-family: monospace;
            text-align: center;
        }

        .color-wrapper {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 4px;
            border: 1px solid #555;
            overflow: hidden;
            cursor: pointer;
        }

        input[type="color"] {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            cursor: pointer;
            border: none;
            padding: 0;
            margin: 0;
        }

        button.copy-btn {
            background: #f1c40f;
            color: #111;
            border: none;
            padding: 12px 20px;
            margin-bottom: 15px;
            margin-top: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .url-box {
            width: 90%;
            background: #111;
            color: #aaa;
            border: 1px solid #444;
            padding: 8px;
            font-size: 11px;
            margin-top: 5px;
            border-radius: 4px;
            resize: none;
        }

        .manual-input-group {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }

        .manual-text {
            font-size: 16px;
            font-weight: bold;
            color: #ecf0f1;
            padding: 5px;
            text-align: center;
            font-family: monospace;
        }

        .reset-btn {
            background: transparent;
            border: 1px dashed #969696; /* Dashed looks nice for a utility action */
            color: #969696;
            font-size: 13px;
            padding: 8px;
            margin-bottom: 10px; /* Space between this and the yellow button */
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .reset-btn:hover {
            border-color: #e74c3c; /* Red hover to indicate reset */
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
        }

        .hex-input-wrapper {
            position: relative;
            width: 110px;
            display: inline-block;
        }

        .hex-input-wrapper::before {
            content: "#";
            position: absolute;
            top: 50%;
            left: 25px;
            transform: translateY(-50%);
            color: #fff;
            font-family: monospace;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.1);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <h2>Dofus Emblemer</h2>
    <p class="subtitle"></p>

    <div class="container">
        <div class="column col-left">
            <div id="statusShield" class="status-bar">Loading Backgrounds...</div>
            <div id="bgGrid" class="grid"></div>
        </div>

        <div class="column col-center">

            <div class="control-group manual-input-group">
                <label style="color:#ffffff;">Current Selection</label>
                <div style="display:flex; justify-content:center; gap:30px;">
                    <div>
                        <div style="font-size:10px; color:#aaa; margin-bottom:2px;">BG ID</div>
                        <div id="manualShieldId" class="manual-text">1</div>
                    </div>
                    <div>
                        <div style="font-size:10px; color:#aaa; margin-bottom:2px;">Motif ID</div>
                        <div id="manualIconId" class="manual-text">1</div>
                    </div>
                </div>
            </div>

            <div class="preview-wrapper">
                <img id="preview" class="preview-img" src="" alt="Preview" referrerpolicy="no-referrer">
            </div>

            <div class="control-group">
                <label>Background Color</label>
                <div class="color-row">
                    <div class="hex-input-wrapper">
                        <input type="text" id="shieldHexText" class="hex-input" value="464646" maxlength="6">
                    </div>
                    <div class="color-wrapper" style="background-color: #464646;" id="shieldColorBg">
                        <input type="color" id="shieldColorPicker" value="#464646">
                    </div>
                </div>
            </div>

            <div class="swap-container">
                <button class="swap-btn" onclick="swapColors()" title="Swap Colors">⇅</button>
            </div>

            <div class="control-group">
                <label>Motif Color</label>
                <div class="color-row">
                    <div class="hex-input-wrapper">
                        <input type="text" id="iconHexText" class="hex-input" value="EAEAEA" maxlength="6">
                    </div>
                    <div class="color-wrapper" style="background-color: #EAEAEA;" id="iconColorBg">
                        <input type="color" id="iconColorPicker" value="#EAEAEA">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <button class="reset-btn" onclick="resetDefaults()">↺ Reset to Defaults</button>
                <button class="copy-btn" onclick="copyLink()">Copy Link</button>
                <textarea id="resultUrl" class="url-box" rows="3" readonly></textarea>
            </div>
        </div>

        <div class="column col-right">
            <div id="statusIcon" class="status-bar">Loading Motifs...</div>
            <div id="motifGrid" class="grid"></div>
        </div>
    </div>

    <script>
        // Config variables
        const maxShields = 200;
        const maxIcons = 1200;

        // Tracking current selection
        let currentShield = 1;
        let currentIcon = 1;
        let shieldColor = "0x464646";
        let iconColor = "0xEAEAEA";

        // DOM Elements
        const bgGrid = document.getElementById('bgGrid');
        const motifGrid = document.getElementById('motifGrid');
        const preview = document.getElementById('preview');

        window.onload = function () {
            // check for saved settings
            if (localStorage.getItem('dofus_bg_id')) {
                currentShield = parseInt(localStorage.getItem('dofus_bg_id'));
            }
            if (localStorage.getItem('dofus_motif_id')) {
                currentIcon = parseInt(localStorage.getItem('dofus_motif_id'));
            }

            // Sync the UI texts
            document.getElementById('manualShieldId').innerText = currentShield;
            document.getElementById('manualIconId').innerText = currentIcon;

            // Grab colors from inputs (in case browser auto-filled them)
            let sHex = document.getElementById('shieldHexText').value;
            let iHex = document.getElementById('iconHexText').value;

            // Format them correctly for the API
            shieldColor = '0x' + fixHex(sHex);
            iconColor = '0x' + fixHex(iHex);

            // Make sure the color pickers match the text inputs
            syncColorPickers();

            // Start loading the images
            loadImages(bgGrid, maxShields, 'bg');
            loadImages(motifGrid, maxIcons, 'motif');

            updatePreview();
            setupEvents();
        }

        // Handles loading images in batches so the page doesn't freeze
        function loadImages(container, total, type) {
            let current = 1;
            let batch = 50;
            let status = (type == 'bg') ? document.getElementById('statusShield') : document.getElementById('statusIcon');

            let loader = setInterval(() => {
                if (current > total) {
                    clearInterval(loader);
                    status.innerText = (type == 'bg') ? "Backgrounds" : "Motifs";
                    return;
                }

                let end = current + batch;
                if (end > total) end = total;

                for (let i = current; i < end; i++) {
                    createItem(container, i, type);
                }
                current += batch;
            }, 50);
        }

        function createItem(container, id, type) {
            let baseUrl = "https://raw.githubusercontent.com/Desiwah/Dofus-Emblemer/main/assets";
            let path = (type == 'bg') ? `${baseUrl}/backgrounds/${id}.png` : `${baseUrl}/motifs/${id}.png`;

            let box = document.createElement('div');
            box.className = 'item-box';
            box.innerHTML = `<div class="id-tag">${id}</div>`;

            let img = new Image();
            img.onload = () => {
                box.appendChild(img);
                box.classList.add('visible'); // triggers the animation

                box.onclick = function () {
                    // remove old selection
                    let old = container.querySelector('.selected');
                    if (old) old.classList.remove('selected');

                    box.classList.add('selected');

                    // update global state
                    if (type == 'bg') {
                        currentShield = id;
                        document.getElementById('manualShieldId').innerText = id;
                        localStorage.setItem('dofus_bg_id', id);
                    } else {
                        currentIcon = id;
                        document.getElementById('manualIconId').innerText = id;
                        localStorage.setItem('dofus_motif_id', id);
                    }
                    updatePreview();
                }
            }
            img.src = path;
            container.appendChild(box);
        }

        function updatePreview() {
            let url = `https://static.ankama.com/dofus/renderer/emblem/${currentIcon}/${currentShield}/${iconColor}/${shieldColor}/600_600-0.png`;
            // add timestamp to force reload
            preview.src = url + "?v=" + Date.now();
            document.getElementById('resultUrl').value = url;
        }

        function fixHex(str) {
            // removes non-hex chars and ensures uppercase
            return str.replace(/[^0-9A-Fa-f]/g, '').toUpperCase().substring(0, 6);
        }

        function syncColorPickers() {
            let sClean = shieldColor.replace('0x', '#');
            let iClean = iconColor.replace('0x', '#');

            document.getElementById('shieldColorPicker').value = sClean;
            document.getElementById('shieldColorBg').style.backgroundColor = sClean;

            document.getElementById('iconColorPicker').value = iClean;
            document.getElementById('iconColorBg').style.backgroundColor = iClean;
        }

        function setupEvents() {
            // Shield Color Picker
            document.getElementById('shieldColorPicker').addEventListener('input', function (e) {
                let hex = e.target.value.replace('#', '');
                document.getElementById('shieldHexText').value = hex.toUpperCase();
                document.getElementById('shieldColorBg').style.backgroundColor = e.target.value;
                shieldColor = '0x' + hex;
                updatePreview();
            });

            // Icon Color Picker
            document.getElementById('iconColorPicker').addEventListener('input', function (e) {
                let hex = e.target.value.replace('#', '');
                document.getElementById('iconHexText').value = hex.toUpperCase();
                document.getElementById('iconColorBg').style.backgroundColor = e.target.value;
                iconColor = '0x' + hex;
                updatePreview();
            });

            // Manual Hex Input (Shield)
            document.getElementById('shieldHexText').addEventListener('input', function (e) {
                let val = fixHex(e.target.value);
                e.target.value = val;
                if (val.length === 6) {
                    shieldColor = '0x' + val;
                    syncColorPickers();
                    updatePreview();
                }
            });

            // Manual Hex Input (Icon)
            document.getElementById('iconHexText').addEventListener('input', function (e) {
                let val = fixHex(e.target.value);
                e.target.value = val;
                if (val.length === 6) {
                    iconColor = '0x' + val;
                    syncColorPickers();
                    updatePreview();
                }
            });
        }

        // Button Functions
        function swapColors() {
            let temp = shieldColor;
            shieldColor = iconColor;
            iconColor = temp;

            // update the text boxes
            document.getElementById('shieldHexText').value = shieldColor.replace('0x', '');
            document.getElementById('iconHexText').value = iconColor.replace('0x', '');

            syncColorPickers();
            updatePreview();
        }

        function resetDefaults() {
            currentShield = 1;
            currentIcon = 1;
            shieldColor = "0x464646";
            iconColor = "0xEAEAEA";

            // reset inputs
            document.getElementById('shieldHexText').value = "464646";
            document.getElementById('iconHexText').value = "EAEAEA";

            // clear selection highlights
            let allSelected = document.querySelectorAll('.selected');
            for (let i = 0; i < allSelected.length; i++) {
                allSelected[i].classList.remove('selected');
            }

            // update UI numbers
            document.getElementById('manualShieldId').innerText = 1;
            document.getElementById('manualIconId').innerText = 1;

            // save
            localStorage.setItem('dofus_bg_id', 1);
            localStorage.setItem('dofus_motif_id', 1);

            syncColorPickers();
            updatePreview();
        }

        function copyLink() {
            let box = document.getElementById('resultUrl');
            box.select();
            navigator.clipboard.writeText(box.value);

            // simple visual feedback
            let btn = document.querySelector('.copy-btn');
            let oldText = btn.innerText;
            btn.innerText = "Copied!";
            btn.style.background = "#2ecc71";
            setTimeout(() => {
                btn.innerText = oldText;
                btn.style.background = "#f1c40f";
            }, 1000);
        }
    </script>
</body>

</html>
