<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Dofus Emblemer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin: 0 0 5px 0;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .container {
            display: flex;
            flex: 1;
            gap: 20px;
            overflow: hidden;
        }

        .column {
            background: #2c2c2c;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .col-left,
        .col-right {
            flex: 1;
            border: 1px solid #444;
            position: relative;
            min-height: 0;
        }

        .col-center {
            flex: 0 0 350px;
            align-items: center;
            padding-top: 10px;
            border: 1px solid #444;
        }

        .status-bar {
            background: #222;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #444;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, 60px);
            gap: 15px;
            justify-content: center;
            justify-items: start;
            padding: 0px 10px;
            align-content: flex-start;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .item-box {
            width: 60px;
            height: 60px;
            background: #333;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            display: none;
            /* hidden until loaded */
            align-items: center;
            justify-content: center;
        }

        .item-box.visible {
            display: flex;
            animation: popIn 0.2s ease-out;
        }

        .item-box:hover {
            border-color: #7f8c8d;
            background: #444;
        }

        .item-box.selected {
            border-color: #ffffff;
            background: #555;
            border-width: 2px;
        }

        .item-box img {
            max-width: 45px;
            max-height: 45px;
        }

        .id-tag {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 9px;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            padding: 1px 3px;
            border-radius: 3px;
            pointer-events: none;
        }

        .preview-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 25px;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            border: 1px solid #555;
            border-radius: 10px;
            background-image: linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px;
        }

        .swap-container {
            display: flex;
            justify-content: center;
            margin: -15px 0 5px 0;
            z-index: 5;
            position: relative;
        }

        .swap-btn {
            background: #222;
            border: 1px solid #555;
            color: #888;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin: 10px;
        }

        .swap-btn:hover {
            background: #444;
            color: #fff;
            border-color: #fff;
            transform: rotate(180deg);
        }

        .control-group {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
            color: #ddd;
        }

        .color-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        input[type="text"].hex-input {
            width: 70px;
            padding: 8px 8px 8px 20px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #111;
            color: #fff;
            font-family: monospace;
            text-align: center;
        }

        .color-wrapper {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 4px;
            border: 1px solid #555;
            overflow: hidden;
            cursor: pointer;
        }

        input[type="color"] {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            cursor: pointer;
            border: none;
            padding: 0;
            margin: 0;
        }

        button.copy-btn {
            background: #f1c40f;
            color: #111;
            border: none;
            padding: 12px 20px;
            margin-bottom: 15px;
            margin-top: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .url-box {
            width: 90%;
            background: #111;
            color: #aaa;
            border: 1px solid #444;
            padding: 8px;
            font-size: 11px;
            margin-top: 5px;
            border-radius: 4px;
            resize: none;
        }

        .manual-input-group {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #444;
        }

        .manual-text {
            font-size: 16px;
            font-weight: bold;
            color: #ecf0f1;
            padding: 5px;
            text-align: center;
            font-family: monospace;
        }

        .hex-input-wrapper {
            position: relative;
            width: 110px;
            display: inline-block;
        }

        .hex-input-wrapper::before {
            content: "#";
            position: absolute;
            top: 50%;
            left: 25px;
            transform: translateY(-50%);
            color: #fff;
            font-family: monospace;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.1);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <h2>Dofus Emblemer</h2>
    <p class="subtitle"></p>

    <div class="container">
        <div class="column col-left">
            <div id="statusShield" class="status-bar">Loading Backgrounds...</div>
            <div id="bgGrid" class="grid"></div>
        </div>

        <div class="column col-center">

            <div class="control-group manual-input-group">
                <label style="color:#ffffff;">Current Selection</label>
                <div style="display:flex; justify-content:center; gap:30px;">
                    <div>
                        <div style="font-size:10px; color:#aaa; margin-bottom:2px;">BG ID</div>
                        <div id="manualShieldId" class="manual-text">1</div>
                    </div>
                    <div>
                        <div style="font-size:10px; color:#aaa; margin-bottom:2px;">Motif ID</div>
                        <div id="manualIconId" class="manual-text">1</div>
                    </div>
                </div>
            </div>

            <div class="preview-wrapper">
                <img id="preview" class="preview-img" src="" alt="Preview" referrerpolicy="no-referrer">
            </div>

            <div class="control-group">
                <label>Background Color</label>
                <div class="color-row">
                    <div class="hex-input-wrapper">
                        <input type="text" id="shieldHexText" class="hex-input" value="464646" maxlength="6">
                    </div>
                    <div class="color-wrapper" style="background-color: #464646;" id="shieldColorBg">
                        <input type="color" id="shieldColorPicker" value="#464646">
                    </div>
                </div>
            </div>

            <div class="swap-container">
                <button class="swap-btn" onclick="swapColors()" title="Swap Colors">⇅</button>
            </div>

            <div class="control-group">
                <label>Motif Color</label>
                <div class="color-row">
                    <div class="hex-input-wrapper">
                        <input type="text" id="iconHexText" class="hex-input" value="EAEAEA" maxlength="6">
                    </div>
                    <div class="color-wrapper" style="background-color: #EAEAEA;" id="iconColorBg">
                        <input type="color" id="iconColorPicker" value="#EAEAEA">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <button class="copy-btn" onclick="copyLink()">Copy Image Link</button>
                <textarea id="resultUrl" class="url-box" rows="3" readonly></textarea>
            </div>
        </div>

        <div class="column col-right">
            <div id="statusIcon" class="status-bar">Loading Motifs...</div>
            <div id="motifGrid" class="grid"></div>
        </div>
    </div>

    <script>
        const MAX_BGS = 200;
        const MAX_MOTIFS = 1200;

        // Waterfall settings
        const BATCH = 50;
        const SPEED = 50;

        // Default state
        let appState = {
            motifId: 1,
            bgId: 1,
            bgHex: "0x464646",
            motifHex: "0xEAEAEA"
        };

        const dom = {
            bgGrid: document.getElementById('bgGrid'),
            motifGrid: document.getElementById('motifGrid'),
            preview: document.getElementById('preview'),
            urlBox: document.getElementById('resultUrl'),
            manualIcon: document.getElementById('manualIconId'),
            manualShield: document.getElementById('manualShieldId'),
            bgStatus: document.getElementById('statusShield'),
            motifStatus: document.getElementById('statusIcon'),

            // Colors
            bgHex: document.getElementById('shieldHexText'),
            bgPicker: document.getElementById('shieldColorPicker'),
            bgBox: document.getElementById('shieldColorBg'),
            iconHex: document.getElementById('iconHexText'),
            iconPicker: document.getElementById('iconColorPicker'),
            iconBox: document.getElementById('iconColorBg')
        };

        window.onload = function () {
            // 1. Get Colors (Inputs - Browser remembers these automatically)
            let savedBg = cleanHex(dom.bgHex.value);
            let savedIcon = cleanHex(dom.iconHex.value);

            // 2. Get IDs from LocalStorage (Custom memory)
            // If nothing is saved, default to 1 and 1
            appState.bgId = parseInt(localStorage.getItem('dofus_bg_id')) || 1;
            appState.motifId = parseInt(localStorage.getItem('dofus_motif_id')) || 1;

            // 3. Update App State
            appState.bgHex = '0x' + savedBg;
            appState.motifHex = '0x' + savedIcon;

            // 4. Sync Visual Controls
            dom.bgPicker.value = '#' + savedBg;
            dom.bgBox.style.backgroundColor = '#' + savedBg;
            dom.iconPicker.value = '#' + savedIcon;
            dom.iconBox.style.backgroundColor = '#' + savedIcon;

            // Update the text numbers to match memory
            dom.manualShield.innerText = appState.bgId;
            dom.manualIcon.innerText = appState.motifId;

            // 5. Start Loading Grids
            startWaterfall(dom.bgGrid, 1, MAX_BGS, 'bg', dom.bgStatus);
            startWaterfall(dom.motifGrid, 1, MAX_MOTIFS, 'motif', dom.motifStatus);

            // 6. Force Preview Update
            refreshPreview();
            initListeners();
        };

        function startWaterfall(container, start, max, type, statusElem) {
            let cursor = start;

            let timer = setInterval(() => {
                if (cursor > max) {
                    clearInterval(timer);
                    statusElem.innerText = (type === 'bg') ? 'Backgrounds' : 'Motifs';
                    return;
                }

                let end = Math.min(cursor + BATCH, max);
                for (let i = cursor; i < end; i++) {
                    loadItem(container, i, type);
                }
                cursor += BATCH;
            }, SPEED);
        }

        function loadItem(container, id, type) {
            const repoBase = "https://raw.githubusercontent.com/Desiwah/Dofus-Emblemer/main/assets";
            let src = (type === 'bg') ? `${repoBase}/backgrounds/${id}.png` : `${repoBase}/motifs/${id}.png`;

            let div = document.createElement('div');
            div.className = 'item-box';
            div.innerHTML = `<div class="id-tag">${id}</div>`;
            container.appendChild(div);

            let img = new Image();
            img.onload = function () {
                div.appendChild(img);
                div.onclick = () => {
                    let old = container.querySelector('.selected');
                    if (old) old.classList.remove('selected');
                    div.classList.add('selected');

                    if (type === 'bg') {
                        appState.bgId = id;
                        dom.manualShield.innerText = id;
                        // SAVE TO MEMORY
                        localStorage.setItem('dofus_bg_id', id);
                    } else {
                        appState.motifId = id;
                        dom.manualIcon.innerText = id;
                        // SAVE TO MEMORY
                        localStorage.setItem('dofus_motif_id', id);
                    }
                    refreshPreview();
                };
                div.classList.add('visible');
                div.style.display = 'flex';
            };
            img.src = src;
        }

        function initListeners() {
            dom.bgPicker.addEventListener('input', (e) => setColor('bg', e.target.value));
            dom.iconPicker.addEventListener('input', (e) => setColor('motif', e.target.value));

            const handleText = (e, type) => {
                let val = (e.clipboardData || window.clipboardData) ? (e.clipboardData || window.clipboardData).getData('text') : e.target.value;
                if (e.type === 'paste') e.preventDefault();

                let hex = cleanHex(val);
                e.target.value = hex;
                if (hex.length === 6) updateFromHex(type, hex);
            };

            ['input', 'paste'].forEach(evt => {
                dom.bgHex.addEventListener(evt, (e) => handleText(e, 'bg'));
                dom.iconHex.addEventListener(evt, (e) => handleText(e, 'motif'));
            });
        }

        function cleanHex(str) {
            return str.replace(/[^0-9A-Fa-f]/g, '').toUpperCase().substring(0, 6);
        }

        function setColor(type, hexStr) {
            let clean = hexStr.replace('#', '0x').toUpperCase();
            if (type === 'bg') {
                appState.bgHex = clean;
                dom.bgHex.value = hexStr.substring(1).toUpperCase();
                dom.bgBox.style.backgroundColor = hexStr;
            } else {
                appState.motifHex = clean;
                dom.iconHex.value = hexStr.substring(1).toUpperCase();
                dom.iconBox.style.backgroundColor = hexStr;
            }
            refreshPreview();
        }

        function updateFromHex(type, hex) {
            let color = "#" + hex;
            if (type === 'bg') {
                dom.bgPicker.value = color;
                dom.bgBox.style.backgroundColor = color;
                appState.bgHex = '0x' + hex;
            } else {
                dom.iconPicker.value = color;
                dom.iconBox.style.backgroundColor = color;
                appState.motifHex = '0x' + hex;
            }
            refreshPreview();
        }

        function refreshPreview() {
            dom.preview.referrerPolicy = "no-referrer";
            // Increased to 2000x2000 for high resolution output
            const url = `https://static.ankama.com/dofus/renderer/emblem/${appState.motifId}/${appState.bgId}/${appState.motifHex}/${appState.bgHex}/2000_2000-0.png`;
            dom.preview.src = `${url}?v=${Date.now()}`;
            dom.urlBox.value = url;
        }

        function copyLink() {
            dom.urlBox.select();
            navigator.clipboard.writeText(dom.urlBox.value);
            const btn = document.querySelector('button.copy-btn');
            const prevText = btn.innerText;

            btn.innerText = "Copied!";
            btn.style.background = "#2ecc71";
            setTimeout(() => {
                btn.innerText = prevText;
                btn.style.background = "#f1c40f";
            }, 1500);
        }

        function swapColors() {
            let tmp = appState.bgHex;
            appState.bgHex = appState.motifHex;
            appState.motifHex = tmp;

            let bgClean = appState.bgHex.replace(/0x/gi, '');
            let motifClean = appState.motifHex.replace(/0x/gi, '');

            dom.bgHex.value = bgClean;
            dom.iconHex.value = motifClean;

            dom.bgPicker.value = '#' + bgClean;
            dom.bgBox.style.backgroundColor = '#' + bgClean;

            dom.iconPicker.value = '#' + motifClean;
            dom.iconBox.style.backgroundColor = '#' + motifClean;

            refreshPreview();
        }
    </script>
</body>

</html>
